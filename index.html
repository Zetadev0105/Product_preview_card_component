<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>

</head>
<body>

  <main class="card">

    <div class="card__img">
      <img src="./images/image-product-mobile.jpg" alt="">
    </div>

    <h2 class="card__product">Perfume</h2>

    <h1 class="card__name">Gabrielle Essence Eau De Parfum</h1>

    <p class="card__description">
      A floral, solar and voluptuous interpretation composed by Olivier Polge,
      Perfumer-Creator for the House of CHANEL.
    </p>

    <div class="card__prices-container">
      <div class="card__price">$149.99</div>
      <div class="card__price">$169.99</div>
    </div>

    <div class="card__botton">
      <img src="./images/icon-cart.svg">
      <p>Add to Cart</p>
    </div>

  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
